[project]
name = "ai-developer-assistant"
version = "0.1.0"
description = "AI developer assistant combining RAG and MCP for codebase understanding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "chromadb>=1.5.9",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.29.0",
    "pathspec>=1.1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.6",
    "uvicorn>=0.54.0",
]

# Install the CPU-only torch build (no CUDA libraries, a much smaller venv).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
ai-dev-assistant = "app.web.server:cli"
ai-dev-assistant-mcp = "app.mcp_server.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: downloads/runs a real embedding model (run with: pytest -m slow)"]
addopts = "-m 'not slow'"
filterwarnings = [
    # Raised inside chromadb on Python 3.14; not actionable here.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
